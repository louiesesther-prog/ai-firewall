<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Login — AI Personal Firewall</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#0a0a1a; --bg2:#12122a; --card:#16163a; --border:#2a2a5a; --primary:#667eea; --primary-light:#8b9cf7; --accent:#00d9ff; --text:#e8e8f0; --text2:#8888aa; --text3:#555577; --gradient:linear-gradient(135deg,#667eea,#764ba2); --err:#f87171; --ok:#22c55e; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; line-height:1.6; }
.wrap { width:100%; max-width:420px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:36px 32px; }
.logo { text-align:center; margin-bottom:8px; }
.logo svg { width:44px; height:44px; }
h1 { font-size:22px; text-align:center; margin-bottom:4px; }
.sub { text-align:center; color:var(--text2); font-size:13px; margin-bottom:26px; }
label { display:block; font-size:13px; color:var(--text2); margin:14px 0 6px; }
input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-size:15px; outline:none; }
input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(102,126,234,0.15); }
input.up { text-transform:uppercase; font-family:'SF Mono',Consolas,monospace; letter-spacing:.05em; }
.btn { width:100%; margin-top:22px; padding:13px; border:0; border-radius:10px; background:var(--gradient); color:white; font-size:15px; font-weight:700; cursor:pointer; transition:transform .15s; }
.btn:hover { transform:translateY(-2px); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.msg { margin-top:16px; font-size:13px; text-align:center; min-height:18px; }
.msg.err { color:var(--err); }
.msg.ok { color:var(--ok); }
.pill { display:inline-block; background:rgba(102,126,234,0.15); color:var(--primary-light); font-size:11px; font-weight:700; padding:3px 10px; border-radius:10px; letter-spacing:.05em; margin-bottom:14px; }
.hint { margin-top:18px; padding:12px 14px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; font-size:12.5px; color:var(--text2); }
.hint b { color:var(--text); }
.foot { text-align:center; margin-top:18px; font-size:13px; color:var(--text3); }
.foot a { color:var(--primary-light); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="5" fill="url(#g)"/><path d="M14 6 L22 14 L14 22 L6 14 Z" fill="white" opacity=".9"/><rect x="10" y="14" width="8" height="8" fill="white" opacity=".9"/><defs><linearGradient id="g" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#667eea"/><stop offset="1" stop-color="#764ba2"/></linearGradient></defs></svg>
    </div>
    <div style="text-align:center"><span class="pill">PRO MEMBERS</span></div>
    <h1>Pro Sign In</h1>
    <p class="sub">Enter the email from your purchase and your Pro license key to unlock the documentation.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="key">License Key</label>
    <input id="key" type="text" class="up" autocomplete="off" placeholder="PRO-XXXX-XXXX-XXXX">
    <button class="btn" id="btn">Unlock Docs</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="hint">Purchased Pro? Your license key was emailed to you after checkout. <b>Keys are per-buyer &mdash; don't share yours.</b></div>
  <div class="foot"><a href="landing.html">&#8592; Back to site</a></div>
</div>

<script src="../pro-lib.js"></script>
<script>
(function () {
  var emailEl = document.getElementById('email');
  var keyEl = document.getElementById('key');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');

  var dest = new URLSearchParams(location.search).get('next') || 'docs.html';

  // already unlocked -> go straight in
  if (AIFW.pro.session()) {
    location.replace(dest);
    return;
  }

  btn.addEventListener('click', function () {
    var email = (emailEl.value || '').trim();
    var key = (keyEl.value || '').trim().toUpperCase();
    msg.className = 'msg';
    msg.textContent = '';

    if (!/.+@.+\..+/.test(email)) {
      msg.textContent = 'Please enter a valid email address.';
      msg.className = 'msg err';
      return;
    }
    if (!AIFW.pro.isValid(key)) {
      msg.textContent = 'That license key is invalid. Double-check it or contact support.';
      msg.className = 'msg err';
      return;
    }
    AIFW.pro.unlock(email, key);
    msg.textContent = 'Key accepted. Unlocking docs...';
    msg.className = 'msg ok';
    btn.disabled = true;
    setTimeout(function () { location.replace(dest); }, 700);
  });

  keyEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') btn.click(); });
})();
</script>
</body>
</html>
