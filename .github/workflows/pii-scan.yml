name: PII Scan
on:
  pull_request:
    paths: ['**/*.js', '**/*.ts', '**/*.py', '**/*.json', '**/*.txt', '**/*.md', '**/*.html', '**/*.css', '**/*.yml', '**/*.yaml', '**/*.env', '**/*.cfg']
  push:
    branches: [main, master]
    paths: ['**/*.js', '**/*.ts', '**/*.py', '**/*.json', '**/*.txt', '**/*.md', '**/*.html', '**/*.css', '**/*.yml', '**/*.yaml', '**/*.env', '**/*.cfg']
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run PII scan
        run: |
          npm install --omit=dev
          node cli.js scan . --format json > pii-report.json 2>&1 || true

      - name: Check for PII findings
        id: check
        run: |
          COUNT=$(node -e "
            const d = require('fs').readFileSync('pii-report.json','utf8');
            try{const o=JSON.parse(d);let c=0;for(const[k,v]of Object.entries(o))c+=v.length;console.log(c);}catch(e){console.log(0);}
          ")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt 0 ]; then echo "PII detected: $COUNT matches"; fi

      - name: Comment PR
        if: ${{ steps.check.outputs.count > 0 && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('pii-report.json','utf8'));
            let body = '## AI Firewall PII Scan Results\n\nPII detected in this PR:\n\n';
            body += '| File | Type | Match | Line |\n|------|------|-------|------|\n';
            for (const [file, findings] of Object.entries(report)) {
              for (const m of findings.slice(0, 10)) {
                body += `| \`${file}\` | ${m.type} | \`${m.match.substring(0, 40)}\` | ${m.line} |\n`;
              }
              if (findings.length > 10) body += `| | *...and ${findings.length - 10} more* | | |\n`;
            }
            body += '\n⚠️ Review and remove PII before merging. Use `git commit --no-verify` to bypass.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Fail if PII found
        if: ${{ steps.check.outputs.count > 0 }}
        run: |
          echo "::error::PII detected (${{ steps.check.outputs.count }} matches). Review the scan report."
          node -e "
            const d=require('fs').readFileSync('pii-report.json','utf8');
            const o=JSON.parse(d);
            for(const[f,vs]of Object.entries(o))vs.forEach(m=>console.log('::error file='+f+',line='+m.line+'::'+m.type+' - '+m.match.substring(0,60)));
          "
          exit 1
