name: PII Scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Scan for PII
        run: node cli.js ci --format json > pii-report.json
        continue-on-error: true

      - name: Parse results
        id: parse
        run: |
          TOTAL=$(node -e "const r=require('./pii-report.json'); console.log(r.totalPII)")
          FAILED=$(node -e "const r=require('./pii-report.json'); console.log(r.failed)")
          echo "total_pii=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const totalPII = '${{ steps.parse.outputs.total_pii }}';
            const failed = '${{ steps.parse.outputs.failed }}' === 'true';
            const icon = failed ? '🚨' : '✅';
            const body = [
              `${icon} **AI Firewall PII Scan**`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| PII Items Found | ${totalPII} |`,
              `| Status | ${failed ? 'FAIL — PII detected in codebase' : 'PASS — no PII found'} |`,
              '',
              failed ? '> **Action required:** Remove or mask PII before merging.' : '> All clear!',
              '',
              '<details><summary>Full report</summary>',
              '',
              '```json',
              require('fs').readFileSync('pii-report.json', 'utf8').slice(0, 3000),
              '```',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail if PII found
        if: steps.parse.outputs.failed == 'true'
        run: |
          echo "::error::PII detected in codebase (${{ steps.parse.outputs.total_pii }} items). Remove or mask before merging."
          exit 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pii-report
          path: pii-report.json
          retention-days: 30
