<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Firewall — Analytics Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;padding:20px;max-width:1400px;margin:0 auto}
h1{color:#818cf8;margin-bottom:4px}
.sub{color:#64748b;font-size:14px;margin-bottom:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.card{background:#1e293b;border-radius:8px;padding:16px;text-align:center}
.card .num{font-size:28px;font-weight:700;color:#818cf8}
.card .lbl{font-size:11px;color:#94a3b8;text-transform:uppercase;margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:768px){.row{grid-template-columns:1fr}}
.panel{background:#1e293b;border-radius:8px;padding:16px;overflow:hidden}
.panel h2{font-size:14px;margin-bottom:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px}
.chart-container{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#0f172a;padding:8px 12px;text-align:left;color:#94a3b8;text-transform:uppercase;font-size:11px;border-bottom:1px solid #334155}
td{padding:6px 12px;border-bottom:1px solid #1e293b}
tr:hover{background:#0f172a}
.badge{display:inline-block;border-radius:10px;padding:2px 8px;font-size:11px}
.badge-high{background:#7f1d1d;color:#fca5a5}
.badge-med{background:#78350f;color:#fcd34d}
.badge-low{background:#14532d;color:#86efac}
.badge-cli{background:#1e3a5f;color:#93c5fd}
.badge-api{background:#3b1f5e;color:#c4b5fd}
.badge-watch{background:#1a3a2a;color:#86efac}
svg text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.empty{color:#64748b;text-align:center;padding:40px;font-size:14px}
.refresh-btn{background:#6366f1;color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px;margin-bottom:16px}
.refresh-btn:hover{background:#4f46e5}
</style>
</head>
<body>
<h1>AI Firewall Analytics</h1>
<div class="sub">PII detection trends, risk overview, and scan history</div>
<button class="refresh-btn" onclick="loadAll()">Refresh Data</button>

<div class="cards">
  <div class="card"><div class="num" id="totalScans">-</div><div class="lbl">Total Scans</div></div>
  <div class="card"><div class="num" id="totalPII">-</div><div class="lbl">PII Detected</div></div>
  <div class="card"><div class="num" id="avgRisk">-</div><div class="lbl">Avg Risk Score</div></div>
  <div class="card"><div class="num" id="todayScans">-</div><div class="lbl">Today's Scans</div></div>
</div>

<div class="row">
  <div class="panel">
    <h2>PII Detections Over Time</h2>
    <div class="chart-container"><svg id="trendChart" width="100%" height="200"></svg></div>
  </div>
  <div class="panel">
    <h2>Top PII Types</h2>
    <div class="chart-container"><svg id="typesChart" width="100%" height="200"></svg></div>
  </div>
</div>

<div class="row">
  <div class="panel">
    <h2>Risk Distribution</h2>
    <div class="chart-container"><svg id="riskChart" width="100%" height="200"></svg></div>
  </div>
  <div class="panel">
    <h2>Scan Sources</h2>
    <div class="chart-container"><svg id="sourceChart" width="100%" height="200"></svg></div>
  </div>
</div>

<div class="panel">
  <h2>Recent Scans</h2>
  <div style="overflow-x:auto">
    <table>
      <thead><tr><th>Time</th><th>Source</th><th>File</th><th>PII Count</th><th>Risk</th><th>Types</th></tr></thead>
      <tbody id="recentBody"><tr><td colspan="6" class="empty">No scan data yet</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const API = '';

async function fetchJSON(path) {
  try {
    const r = await fetch(API + path);
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

function drawBarChart(svgId, data, { xKey, yKey, color = '#818cf8', maxBars = 12 } = {}) {
  const svg = document.getElementById(svgId);
  if (!svg || !data || data.length === 0) { if (svg) svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#64748b" font-size="13">No data available</text>'; return; }
  const displayData = data.slice(0, maxBars);
  const w = svg.clientWidth || 500;
  const h = 200;
  const pad = { top: 20, right: 20, bottom: 40, left: 50 };
  const chartW = w - pad.left - pad.right;
  const chartH = h - pad.top - pad.bottom;
  const maxVal = Math.max(...displayData.map(d => d[yKey] || 0), 1);
  const barW = Math.min(40, chartW / displayData.length - 4);

  let html = '';
  displayData.forEach((d, i) => {
    const x = pad.left + (i * (chartW / displayData.length)) + (chartW / displayData.length - barW) / 2;
    const barH = ((d[yKey] || 0) / maxVal) * chartH;
    const y = pad.top + chartH - barH;
    const opacity = 0.6 + (0.4 * (d[yKey] / maxVal));
    html += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + barH + '" fill="' + color + '" opacity="' + opacity + '" rx="2">';
    html += '<title>' + (d[xKey] || '') + ': ' + (d[yKey] || 0) + '</title></rect>';
    html += '<text x="' + (x + barW/2) + '" y="' + (h - 5) + '" text-anchor="middle" fill="#94a3b8" font-size="10">' + String(d[xKey] || '').substring(0, 8) + '</text>';
    if (d[yKey] > 0) html += '<text x="' + (x + barW/2) + '" y="' + (y - 4) + '" text-anchor="middle" fill="#e2e8f0" font-size="10">' + d[yKey] + '</text>';
  });
  html += '<line x1="' + pad.left + '" y1="' + (pad.top + chartH) + '" x2="' + (w - pad.right) + '" y2="' + (pad.top + chartH) + '" stroke="#334155" stroke-width="1"/>';
  svg.innerHTML = html;
}

function drawPieChart(svgId, data, { colors = ['#ef4444', '#f59e0b', '#22c55e', '#6366f1', '#8b5cf6'] } = {}) {
  const svg = document.getElementById(svgId);
  if (!svg || !data || data.length === 0) { if (svg) svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#64748b" font-size="13">No data available</text>'; return; }
  const w = svg.clientWidth || 500;
  const h = 200;
  const cx = w / 3;
  const cy = h / 2;
  const r = Math.min(cx, cy) - 20;
  const total = data.reduce((s, d) => s + (d.count || 0), 0) || 1;

  let html = '';
  let startAngle = -Math.PI / 2;
  data.forEach((d, i) => {
    const slice = (d.count || 0) / total;
    const endAngle = startAngle + slice * 2 * Math.PI;
    const x1 = cx + r * Math.cos(startAngle);
    const y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const large = slice > 0.5 ? 1 : 0;
    const color = colors[i % colors.length];
    if (data.length === 1) {
      html += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + color + '" opacity="0.7">';
    } else {
      html += '<path d="M ' + cx + ' ' + cy + ' L ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 + ' Z" fill="' + color + '" opacity="0.7">';
    }
    html += '<title>' + (d.level || d.source || '') + ': ' + (d.count || 0) + '</title></path>';
    startAngle = endAngle;
  });

  let ly = 20;
  const lx = w * 0.65;
  data.forEach((d, i) => {
    const color = colors[i % colors.length];
    html += '<rect x="' + lx + '" y="' + ly + '" width="12" height="12" fill="' + color + '" rx="2"/>';
    html += '<text x="' + (lx + 18) + '" y="' + (ly + 10) + '" fill="#e2e8f0" font-size="12">' + (d.level || d.source || '') + ': ' + (d.count || 0) + '</text>';
    ly += 22;
  });
  svg.innerHTML = html;
}

function drawLineChart(svgId, data) {
  const svg = document.getElementById(svgId);
  if (!svg || !data || data.length === 0) { if (svg) svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#64748b" font-size="13">No data available</text>'; return; }
  const w = svg.clientWidth || 500;
  const h = 200;
  const pad = { top: 20, right: 20, bottom: 40, left: 50 };
  const chartW = w - pad.left - pad.right;
  const chartH = h - pad.top - pad.bottom;
  const maxVal = Math.max(...data.map(d => Math.max(d.scans || 0, d.pii_count || 0)), 1);

  let html = '<polyline points="';
  data.forEach((d, i) => {
    const x = pad.left + (i / Math.max(data.length - 1, 1)) * chartW;
    const y = pad.top + chartH - ((d.pii_count || 0) / maxVal) * chartH;
    html += x + ',' + y + ' ';
  });
  html += '" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8"/>';

  data.forEach((d, i) => {
    const x = pad.left + (i / Math.max(data.length - 1, 1)) * chartW;
    const y = pad.top + chartH - ((d.pii_count || 0) / maxVal) * chartH;
    html += '<circle cx="' + x + '" cy="' + y + '" r="3" fill="#818cf8"><title>' + d.day + ': ' + (d.pii_count || 0) + ' PII</title></circle>';
    if (i % Math.max(Math.floor(data.length / 7), 1) === 0) {
      html += '<text x="' + x + '" y="' + (h - 5) + '" text-anchor="middle" fill="#94a3b8" font-size="10">' + String(d.day || '').substring(5) + '</text>';
    }
  });
  html += '<line x1="' + pad.left + '" y1="' + (pad.top + chartH) + '" x2="' + (w - pad.right) + '" y2="' + (pad.top + chartH) + '" stroke="#334155" stroke-width="1"/>';
  svg.innerHTML = html;
}

async function loadAll() {
  const [summary, trend, types, risk, recent] = await Promise.all([
    fetchJSON('/api/analytics/summary'),
    fetchJSON('/api/analytics/trend'),
    fetchJSON('/api/analytics/types'),
    fetchJSON('/api/analytics/risk'),
    fetchJSON('/api/analytics/recent'),
  ]);

  if (summary) {
    document.getElementById('totalScans').textContent = (summary.totals && summary.totals.total_scans) || 0;
    document.getElementById('totalPII').textContent = (summary.totals && summary.totals.total_pii) || 0;
    document.getElementById('avgRisk').textContent = summary.totals && summary.totals.avg_risk ? Math.round(summary.totals.avg_risk) : 0;
    document.getElementById('todayScans').textContent = (summary.today && summary.today.scans) || 0;
    drawPieChart('sourceChart', (summary.bySource || []).map(s => ({ source: s.source, count: s.count })));
  }

  if (trend) drawLineChart('trendChart', trend);
  if (types) drawBarChart('typesChart', types.map(t => ({ label: t.pii_type, count: t.count })), { xKey: 'label', yKey: 'count', color: '#818cf8' });
  if (risk) drawPieChart('riskChart', risk.map(r => ({ level: r.level, count: r.count })), { colors: ['#ef4444', '#f59e0b', '#22c55e'] });

  if (recent && recent.length > 0) {
    const body = document.getElementById('recentBody');
    body.innerHTML = '';
    for (const s of recent) {
      const types = JSON.parse(s.pii_types || '[]');
      const riskClass = s.risk_score >= 50 ? 'high' : s.risk_score >= 20 ? 'med' : 'low';
      const sourceClass = ['cli','api','watch','bot'].includes(s.source) ? s.source : 'cli';
      body.innerHTML += '<tr><td>' + (s.timestamp || '') + '</td><td><span class="badge badge-' + sourceClass + '">' + s.source + '</span></td><td>' + (s.file_path || '-') + '</td><td>' + s.total_matches + '</td><td><span class="badge badge-' + riskClass + '">' + (s.risk_score || 0) + '</span></td><td>' + types.join(', ') + '</td></tr>';
    }
  }
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
