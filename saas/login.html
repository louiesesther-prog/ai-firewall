<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Firewall — Sign In</title>
  <link rel="stylesheet" href="/saas/css/dashboard.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>AI Firewall</h1>
        <p>Protect your data in the AI era</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showTab('login')">Sign In</button>
        <button class="auth-tab" onclick="window.location.href='/register'">Sign Up</button>
      </div>

      <div id="error" class="error-msg"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@company.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Sign In</button>
      </form>

      <div class="auth-footer">
        <a href="/">← Back to homepage</a>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('afw_token')) {
      window.location.href = '/dashboard';
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.add('show');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Signing in...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('afw_token', data.token);
        localStorage.setItem('afw_user', JSON.stringify(data.user));
        if (data.teams && data.teams.length > 0) {
          localStorage.setItem('afw_team', JSON.stringify(data.teams[0]));
        }
        window.location.href = '/dashboard';
      } catch (err) {
        showError(err.message);
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
