<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Firewall — Create Account</title>
  <link rel="stylesheet" href="/saas/css/dashboard.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>AI Firewall</h1>
        <p>Protect your data in the AI era</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab" onclick="window.location.href='/login'">Sign In</button>
        <button class="auth-tab active">Sign Up</button>
      </div>

      <div id="error" class="error-msg"></div>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Jane Smith" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="jane@company.com" required>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Min 8 characters" required minlength="8">
        </div>
        <div class="form-group">
          <label>Team Name (optional)</label>
          <input type="text" id="teamName" placeholder="Acme Corp">
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('afw_token')) {
      window.location.href = '/dashboard';
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.add('show');
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Creating account...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            teamName: document.getElementById('teamName').value || undefined
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        localStorage.setItem('afw_token', data.token);
        localStorage.setItem('afw_user', JSON.stringify(data.user));
        if (data.team) {
          localStorage.setItem('afw_team', JSON.stringify(data.team));
        }
        window.location.href = '/dashboard';
      } catch (err) {
        showError(err.message);
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
