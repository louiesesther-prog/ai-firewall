services:
  cli:
    build: .
    image: ai-firewall:latest
    entrypoint: ["node", "/app/cli.js"]
    command: ["--help"]
    volumes:
      - .:/data:ro
    working_dir: /data

  scan:
    build: .
    image: ai-firewall:latest
    entrypoint: ["node", "/app/cli.js"]
    command: ["scan", ".", "--summary"]
    volumes:
      - .:/data:ro
    working_dir: /data

  api:
    build: .
    image: ai-firewall:latest
    entrypoint: ["node", "/app/server.js"]
    ports:
      - "3000:3000"
    volumes:
      - .:/data:ro
    working_dir: /data
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./sw.js:/usr/share/nginx/html/sw.js:ro
      - ./manifest.json:/usr/share/nginx/html/manifest.json:ro
    restart: unless-stopped
