version: '3.8'

services:
  # ── Cloud SaaS ────────────────────────────────────────
  saas:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - cloud-data:/root/.ai-firewall
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Local CLI/Server (self-hosted) ────────────────────
  # Uncomment to also run the self-hosted version:
  # local:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3001:3000"
  #   volumes:
  #     - local-data:/root/.ai-firewall
  #   restart: unless-stopped

volumes:
  cloud-data:
  # local-data:
